name: ios-build

# Builds the stock-compatible iOS app on a standard hosted macOS runner,
# subject to GitHub's current usage and billing policy. CI has no Apple signing
# identity, so it applies a private-entitlement-free ad-hoc signature and
# uploads a transport artifact. Stock installation requires the user's normal
# provisioning signature; privileged lab tooling is never an app runtime
# dependency. The workflow does not install or launch the app.
on:
  push:
    paths:
      - 'app/**'
      - 'core/**'
      # The app compiles eight C files out of tools/, plus generated assembly
      # (see app/project.yml, which lists them rather than pulling in the
      # directory). Without
      # these, a change to one of them cannot trigger this workflow -- and that
      # is not hypothetical: d38f1c4 FIXED an iOS build break in
      # tools/rootfs_work.c and did not run this job, because the fix touched
      # only tools/. Listed individually, mirroring project.yml, so ordinary
      # desktop-harness churn in tools/ does not spend macOS runner minutes.
      - 'tools/file_block.c'
      - 'tools/guest_patch.c'
      - 'tools/ios3_bringup_gate.c'
      - 'tools/ios3_bringup_gate.h'
      - 'tools/ios3_hle.c'
      - 'tools/ios3_hle.h'
      - 'tools/ios3_kernel_patch.c'
      - 'tools/ios3_kernel_patch.h'
      - 'tools/rootfs_work.c'
      - 'tools/rootfs_work.h'
      - 'tools/sha256.c'
      - 'tools/sha256.h'
      - 'tools/file_block.h'
      - 'tools/guest_patch.h'
      - 'tools/a64_static.c'
      - 'tools/a64_static.h'
      - 'tools/gen_a64_static.py'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      experimental_hle:
        description: 'Build an explicitly labelled native-raster HLE candidate'
        required: false
        default: false
        type: boolean
      experimental_mbx:
        description: 'Build a separate-container MBX-default phone candidate'
        required: false
        default: false
        type: boolean
      experimental_simulator:
        description: 'Build an iphonesimulator .app instead of a device .ipa (for local xcrun simctl use, e.g. to capture a real os_log/lldb trace of a bug that only reproduces via the full app boot path, not bootkernel)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: build ad-hoc-signed .ipa
    runs-on: macos-15
    env:
      EXPERIMENTAL_HLE: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_hle && 'true' || 'false' }}
      EXPERIMENTAL_MBX: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_mbx && 'true' || 'false' }}
      SIMULATOR_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_simulator && 'true' || 'false' }}
      IPA_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental_hle && 'NEON-hle-experimental-ipa' || github.event_name == 'workflow_dispatch' && inputs.experimental_mbx && 'NEON-mbx-experimental-ipa' || 'NEON-ipa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (pinned)
        # Pin XcodeGen to a known-good release so a previously-green build can't
        # break from Homebrew drift (a newer XcodeGen could emit a project format
        # the runner's Xcode can't read). Bump deliberately, not implicitly.
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.46.0
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Verify stock-iPhone app policy
        working-directory: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          entitlements = plistlib.loads(Path("NEON.entitlements").read_bytes())
          if entitlements:
              raise SystemExit(
                  f"shipping app requests entitlements: {entitlements!r}"
              )

          forbidden = (
              "/var/jb",
              "jbctl",
              "dynamic-codesigning",
              "get-task-allow",
              "com.apple.developer.kernel.increased-memory-limit",
              "platform-application",
              "com.apple.private.security.no-container",
              "com.apple.private.skip-library-validation",
              "MobileSubstrate",
              "libhooker",
              "ElleKit",
          )
          checked = [Path("project.yml"), Path("NEON.entitlements")]
          checked.extend(Path("Sources").rglob("*"))
          violations = []
          for path in checked:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="strict")
              for marker in forbidden:
                  if marker.lower() in text.lower():
                      violations.append(f"{path}: {marker}")
          if violations:
              raise SystemExit(
                  "jailbreak/private host dependency leaked into app target:\n" +
                  "\n".join(violations)
              )
          PY

      - name: Select newest installed Xcode
        # XcodeGen emits the Xcode 16 project format (objectVersion 77); pick the
        # highest-versioned Xcode present so xcodebuild can read it.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Compile-check every JIT source for iphoneos
        # The app deliberately excludes jit/** until the run loop owns a code
        # cache. Keep the exact iOS preprocessor/API path from silently rotting
        # in the meantime, especially the no-pthread A9 RWX policy.
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -std=c11 -Wall -Wextra -Werror -Werror=unguarded-availability-new \
            -arch arm64 -miphoneos-version-min=13.0 \
            -DS5LBOX_JIT=1 -Icore/include -isysroot "$sdkroot" \
            -fsyntax-only \
            core/src/jit/a64_emit.c \
            core/src/jit/jit_translate.c \
            core/src/jit/jit_mem.c

      - name: Generate Xcode project
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p Generated
          python3 ../tools/gen_a64_static.py \
            Generated/a64_static_handlers.S
          test -s Generated/a64_static_handlers.S
          xcodegen generate

      - name: Build (unsigned, arm64/iphoneos)
        working-directory: app
        run: |
          set -euo pipefail
          # Positional parameters expand safely to zero arguments under
          # `set -u`; an empty Bash 3.2 array does not. Hosted macOS still
          # exposes that older nounset behavior.
          set --
          if [ "$EXPERIMENTAL_HLE" = true ] && [ "$EXPERIMENTAL_MBX" = true ]; then
            echo "experimental_hle and experimental_mbx are mutually exclusive" >&2
            exit 2
          elif [ "$EXPERIMENTAL_HLE" = true ]; then
            set -- "OTHER_CFLAGS=-DS5LBOX_IOS3_HLE_EXPERIMENT=1"
          elif [ "$EXPERIMENTAL_MBX" = true ]; then
            # A separate identifier means separate NSUserDefaults, firmware,
            # and machine images. The first MBX run therefore cannot inherit a
            # normal app's persistent CPU-renderer choice while still looking
            # like a controlled experiment.
            set -- \
              "OTHER_CFLAGS=-DS5LBOX_MBX_EXPERIMENT=1" \
              "PRODUCT_BUNDLE_IDENTIFIER=com.j0shua.S5LBox.MBXExperiment" \
              "S5LBOX_DISPLAY_NAME=NEON MBX"
          fi
          # The simulator needs no device signing story at all -- it is not
          # a stock-device install path and never will be, so this branch
          # exists purely for local xcrun simctl diagnostic use, never for
          # anything shipped or distributed.
          sdk=iphoneos
          if [ "$SIMULATOR_BUILD" = true ]; then
            sdk=iphonesimulator
          fi
          xcodebuild \
            -project NEON.xcodeproj \
            -target NEON \
            -configuration Release \
            -sdk "$sdk" \
            -arch arm64 \
            S5LBOX_SOURCE_REVISION="$GITHUB_SHA" \
            CONFIGURATION_BUILD_DIR="$PWD/dist" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "$@" \
            build
          binary="$PWD/dist/NEON.app/NEON"
          test -f "$binary"
          xcrun nm "$binary" |
            awk '$NF == "_a64_static_execute" { found=1 }
                 END { exit !found }'
          if [ "$EXPERIMENTAL_HLE" = true ]; then
            xcrun nm "$binary" |
              awk '$NF == "_vm_firmware_hle_enable" { found=1 }
                   END { exit !found }'
          fi
          if [ "$EXPERIMENTAL_MBX" = true ]; then
            plist="$PWD/dist/NEON.app/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = \
              "com.j0shua.S5LBox.MBXExperiment"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = \
              "NEON MBX"
          fi

      - name: Ad-hoc sign transport artifact + package .ipa
        if: env.SIMULATOR_BUILD != 'true'
        working-directory: app
        run: |
          set -euo pipefail
          APP="dist/NEON.app"
          test -d "$APP"
          # Apple's built-in signer creates a structurally complete transport
          # artifact with the deliberately empty entitlement contract. This is
          # not a stock-device provisioning signature; stock installers must
          # replace it with the user's valid profile/signature.
          codesign --force --sign - --timestamp=none \
            --entitlements NEON.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --entitlements :- "$APP" \
            > dist/embedded-entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          declared = plistlib.loads(Path("NEON.entitlements").read_bytes())
          embedded = plistlib.loads(
              Path("dist/embedded-entitlements.plist").read_bytes()
          )
          if declared or embedded != declared:
              raise SystemExit(
                  f"stock entitlement contract mismatch: "
                  f"declared={declared!r}, embedded={embedded!r}"
              )
          PY
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NEON.ipa Payload
          ls -lh NEON.ipa

      - name: Package .app for simulator (unsigned, no .ipa)
        if: env.SIMULATOR_BUILD == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          test -d dist/NEON.app
          ditto -c -k --sequesterRsrc --keepParent dist/NEON.app NEON-simulator.zip
          ls -lh NEON-simulator.zip

      - name: Upload .ipa
        if: env.SIMULATOR_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: app/NEON.ipa
          if-no-files-found: error

      - name: Upload simulator .app
        if: env.SIMULATOR_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NEON-simulator-app
          path: app/NEON-simulator.zip
          if-no-files-found: error
